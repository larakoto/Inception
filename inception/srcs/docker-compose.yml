
services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    networks:
      - inception
    environment:
      - DB_PASS_FILE=/run/secrets/db_pass
    secrets:
      - db_pass
    restart: unless-stopped
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    configs:
      - source: wp_config
        target: /etc/php/8.2/fpm/pool.d/www.conf
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    networks:
      - inception
    expose:
      - "9000"
    environment:
      - DB_PASS_FILE=/run/secrets/db_pass
      - USER_PASS_FILE=/run/secrets/wp_user_pass
      - ADMIN_PASS_FILE=/run/secrets/wp_admin_pass
    secrets:
      - wp_admin_pass
      - wp_user_pass
      - db_pass
    restart: unless-stopped
  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    restart: unless-stopped
volumes:
  mariadb_data:
    driver_opts:
      o: bind
      type: none
      device: /home/larakoto/data/mariadb
  wordpress_data:
    driver_opts:
      o: bind
      type: none
      device: /home/larakoto/data/wordpress
networks:
  inception:
    driver: bridge
configs:
  wp_config:
    file: requirements/wordpress/php.conf
secrets:
  db_pass:  
    file: ../secrets/db_pass.txt
  wp_admin_pass:
    file: ../secrets/wp_admin_pass.txt
  wp_user_pass:
    file: ../secrets/wp_user_pass.txt